services:
  frontend:
    build:
      context: frontend
    container_name: "daily_review"
    image: dailyreview/frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:9000
    ports:
      - "5173:80"
    networks:
      - inside

  backend:
    build:
      context: backend
    container_name: "backend"
    image: dailyreview/backend
    expose:
      - "9000"
    networks:
      - inside
      - outside

networks:
  outside:
    driver: bridge
  inside:
    name: "daily_review"
