services:
  frontend:
    build:
      context: frontend
    container_name: "daily_review"
    image: dailyreview/frontend
    depends_on:
      - backend
    environment:
      VITE_CACHE_DIR: /tmp/.vite
      API_PROXY_TARGET: http://backend:9000
    expose:
      - "5173"
    ports:
      - "5173:5173"
    networks:
      - inside

  backend:
    build:
      context: backend
    container_name: "backend"
    image: dailyreview/backend
    expose:
      - "9000"
    networks:
      - inside
      - outside

networks:
  outside:
    driver: bridge
  inside:
    name: "daily_review"




